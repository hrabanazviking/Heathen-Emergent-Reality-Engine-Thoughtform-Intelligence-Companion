[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heretic"
version = "0.1.0.dev0"
description = "H.E.R.E.T.I.C. — Host Environment for Realtime Embodiment, Tooling & Interactive Control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

# Runtime dependencies — keep minimal at the skeleton stage.
# L0 Grunnr needs pyyaml.
# L1 Bifröst needs httpx for the OpenAI-compat HTTP client.
# Forge adds more as layers are implemented.
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Core dev toolchain — always install for any contributor.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]
# Voice output — install when the machine has speakers and the user wants TTS.
# sounddevice is NOT a core dep: ``pip install heretic`` works on headless machines.
# ``pip install heretic[voice]`` activates SoundDeviceBackend (cross-platform audio).
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.21",
]

[project.scripts]
heretic = "heretic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Show short traceback for skip-marked tests during skeleton phase.
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
